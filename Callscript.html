<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call Script — full-screen card</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --primary:#FA8072; --primary-light:#FFB4A2; --primary-dark:#E96E5D; --accent:#FFA07A;
  --bg:#F1F3F5;
  --text:#2D3748; --text-2:#718096; --text-3:#A0AEC0;
  --white:#fff; --g50:#F8F9FA; --g100:#F1F3F5; --g200:#E9ECEF; --g300:#DEE2E6;
  --success:#10B981; --success-dark:#059669; --warning:#F59E0B;
  --sh-sm:0 2px 4px rgba(0,0,0,.05); --sh-md:0 4px 12px rgba(0,0,0,.08); --sh-lg:0 10px 30px rgba(0,0,0,.12);
  --sidebar:236px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;
}

/* sidebar */
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar);height:100vh;background:var(--white);
  border-right:1px solid var(--g200);display:flex;flex-direction:column;z-index:50}
.sidebar-head{display:flex;align-items:center;gap:.7rem;padding:1.25rem 1.1rem;border-bottom:1px solid var(--g200)}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.logo-text{font-weight:700;font-size:1.15rem}
.sidebar-nav{padding:.75rem .6rem;display:flex;flex-direction:column;gap:.2rem;overflow-y:auto}
.nav{display:flex;align-items:center;gap:.75rem;padding:.7rem .85rem;border-radius:10px;color:var(--text-2);
  text-decoration:none;font-size:.9rem;font-weight:500}
.nav i{width:18px;text-align:center;font-size:1rem}
.nav:hover{background:var(--g100);color:var(--text)}
.nav.active{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;box-shadow:0 4px 12px rgba(250,128,114,.3)}

/* shell */
.wrap{margin-left:var(--sidebar);height:100vh;display:flex;flex-direction:column;padding:1rem 1.25rem 1.25rem}
.searchbar{flex:0 0 auto;position:relative;margin-bottom:.85rem}
.searchbar i.lead{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--primary)}
.searchbar input{width:100%;padding:.7rem 1rem .7rem 2.75rem;background:var(--white);border:1.5px solid var(--g200);
  border-radius:12px;font-size:.95rem;font-family:inherit}
.searchbar input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(250,128,114,.12)}
.dd{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--white);border:1px solid var(--g200);
  border-radius:12px;box-shadow:var(--sh-lg);overflow:hidden;display:none;z-index:80;max-height:340px;overflow-y:auto}
.dd.open{display:block}
.dd-row{display:flex;align-items:center;gap:.75rem;padding:.7rem 1rem;cursor:pointer;border-bottom:1px solid var(--g100)}
.dd-row:last-child{border-bottom:none}
.dd-row:hover{background:var(--g50)}
.dd-row .pin{width:30px;height:30px;border-radius:8px;background:var(--g100);color:var(--text-3);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dd-row .city{font-weight:600}
.dd-row .meta{font-size:.75rem;color:var(--text-3)}

/* THE FULL-SCREEN CARD */
.card{flex:1 1 auto;min-height:0;background:var(--white);border:1px solid var(--g200);border-radius:18px;
  box-shadow:var(--sh-md);display:flex;flex-direction:column;overflow:hidden}

/* empty state */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
.empty .ic{width:88px;height:88px;border-radius:22px;background:linear-gradient(135deg,rgba(250,128,114,.12),rgba(255,160,122,.12));
  display:flex;align-items:center;justify-content:center;font-size:2.25rem;color:var(--primary);margin-bottom:1.1rem}
.empty h2{font-size:1.35rem;margin-bottom:.4rem}
.empty p{color:var(--text-2);max-width:380px;line-height:1.55}

/* card header — salmon gradient (the style you liked) */
.card-head{flex:0 0 auto;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;
  padding:1rem 1.4rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;position:relative;overflow:hidden}
.card-head::before{content:'';position:absolute;top:-60%;right:-10%;width:50%;height:220%;
  background:radial-gradient(circle,rgba(255,255,255,.18),transparent 60%)}
.card-head .ht{position:relative;z-index:1;min-width:0}
.card-head .eyebrow{font-size:.6875rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85;
  display:flex;align-items:center;gap:.4rem;margin-bottom:.2rem}
.card-head h1{font-size:1.4rem;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-head .addr{font-size:.85rem;opacity:.95;display:flex;align-items:center;gap:.4rem;margin-top:.2rem}
.card-head .hc{position:relative;z-index:1;display:flex;align-items:center;gap:.6rem;flex-shrink:0}
.head-btn{display:inline-flex;align-items:center;gap:.45rem;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);
  border:1.5px solid rgba(255,255,255,.4);color:#fff;padding:.5rem .8rem;border-radius:10px;font-size:.8125rem;
  font-weight:700;text-decoration:none;white-space:nowrap;transition:all .2s}
.head-btn:hover{background:#fff;color:var(--primary-dark);border-color:#fff}
.prog-pill{display:inline-flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.35);
  border-radius:10px;padding:.4rem .7rem;font-size:.8125rem;font-weight:700;white-space:nowrap}
.prog-pill .pv{opacity:.95}
.prog-pill a{margin-left:.2rem;background:#fff;color:var(--primary-dark);text-decoration:none;font-size:.6875rem;
  font-weight:800;padding:.2rem .45rem;border-radius:6px;text-transform:uppercase;letter-spacing:.04em}

/* color-meaning legend */
.legend{flex:0 0 auto;display:flex;gap:1.4rem;align-items:center;padding:.45rem 1.4rem;background:var(--g50);
  border-bottom:1px solid var(--g200);font-size:.7rem;font-weight:600;color:var(--text-2)}
.legend .lg{display:inline-flex;align-items:center;gap:.45rem}
.legend .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend .dot.good{background:var(--success)}
.legend .dot.flag{background:var(--warning)}

/* card body — two columns */
.card-body{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:0.92fr 1.08fr;gap:0}
.col{min-height:0;display:flex;flex-direction:column;padding:1.25rem 1.4rem;overflow-y:auto}
.col-money{border-right:1px solid var(--g200);background:var(--g50)}
.col-lesson{overflow:hidden}        /* lesson manages its own inner scroll */

.block-label{font-size:.6875rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);
  display:flex;align-items:center;gap:.4rem;margin-bottom:.6rem}
.block-label i{color:var(--primary)}
.block + .block{margin-top:1.25rem}

/* price */
.price-row{display:flex;align-items:flex-end;gap:.75rem;flex-wrap:wrap}
.price-amt{font-size:2.75rem;font-weight:800;line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price-unit{font-size:.9rem;color:var(--text-2);padding-bottom:.35rem}
.price-badge{margin-bottom:.45rem;font-size:.625rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--text-2);background:var(--g100);padding:.22rem .5rem;border-radius:6px}
.cadence{margin-top:.5rem;color:var(--text-2);font-size:.9rem}
.cadence strong{color:var(--text)}
.other{margin-top:.7rem;display:flex;gap:.5rem;flex-wrap:wrap}
.other .ol{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--g200);background:var(--white);
  border-radius:9px;padding:.35rem .65rem;font-size:.8125rem}
.other .ol .l{color:var(--text-3)}
.other .ol .p{font-weight:700;font-variant-numeric:tabular-nums}

/* billing */
.steps{display:flex;flex-direction:column;gap:.55rem}
.step{display:flex;align-items:center;gap:.65rem}
.step .num{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800}
.step .sl{font-size:.7rem;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.step .sv{font-weight:700;font-size:.875rem}
.step .sv.warn{color:var(--warning)}
.annual{margin-bottom:.85rem;padding:.7rem .85rem;background:rgba(245,158,11,.08);
  border:1px solid rgba(245,158,11,.3);border-radius:10px}
.annual-top{display:flex;align-items:center;gap:.55rem}
.annual-ic{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--warning),#FBBF24);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0}
.annual-amt{font-weight:800;font-size:1.05rem;color:#92400E}
.annual-amt .per{font-size:.7rem;color:var(--text-2);font-weight:500}
.annual-lbl{font-size:.625rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}
.covers{margin-top:.55rem;display:flex;flex-wrap:wrap;gap:.35rem}
.cchip{font-size:.72rem;border:1px solid rgba(16,185,129,.25);background:var(--white);border-radius:7px;
  padding:.2rem .5rem;display:inline-flex;align-items:center;gap:.3rem}
.cchip i{color:var(--success-dark);font-size:.6rem}

/* promos */
.promo{display:flex;align-items:center;gap:.65rem;padding:.5rem .7rem;background:var(--white);border:1px solid var(--g200);
  border-left:3px solid var(--primary);border-radius:9px}
.promo + .promo{margin-top:.45rem}
.promo .pct{flex-shrink:0;font-size:.78rem;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--accent));padding:.25rem .55rem;border-radius:8px;min-width:54px;text-align:center}
.promo .pn{font-weight:700;font-size:.875rem}
.promo .pd{color:var(--text-3);font-size:.78rem}
.promo-none{font-size:.85rem;color:var(--text-3);font-style:italic}

/* instrument selector */
.inst-zone{flex:0 0 auto}
.inst-pick{position:relative}
.inst-field{position:relative}
.inst-field i.lead{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--primary);z-index:2}
.inst-input{width:100%;padding:.7rem 2.3rem .7rem 2.6rem;background:var(--g50);border:1.5px solid var(--g200);
  border-radius:11px;font-size:.95rem;font-weight:600;font-family:inherit;color:var(--text)}
.inst-input::placeholder{color:var(--text-3);font-weight:500}
.inst-input:focus{outline:none;border-color:var(--primary);background:var(--white);box-shadow:0 0 0 3px rgba(250,128,114,.1)}
.inst-input.chosen{background:linear-gradient(135deg,rgba(250,128,114,.06),rgba(255,160,122,.06));border-color:var(--primary);color:var(--primary-dark);font-weight:700}
.inst-caret{position:absolute;right:.85rem;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:.75rem;pointer-events:none}
.inst-clear{position:absolute;right:.7rem;top:50%;transform:translateY(-50%);width:20px;height:20px;border:none;
  background:var(--primary);color:#fff;border-radius:50%;cursor:pointer;font-size:.6rem}
.inst-dd{position:absolute;left:0;right:0;top:calc(100% + 5px);background:var(--white);border:1px solid var(--g200);
  border-radius:11px;box-shadow:var(--sh-lg);overflow:hidden;display:none;z-index:30;max-height:240px;overflow-y:auto}
.inst-dd.open{display:block}
.inst-dd-row{display:flex;align-items:center;gap:.6rem;padding:.55rem .8rem;cursor:pointer;border-bottom:1px solid var(--g100)}
.inst-dd-row:last-child{border-bottom:none}
.inst-dd-row:hover{background:var(--g50)}
.inst-dd-row .di{width:26px;height:26px;border-radius:7px;background:var(--g100);color:var(--text-3);
  display:flex;align-items:center;justify-content:center;font-size:.78rem;flex-shrink:0}
.inst-dd-row:hover .di{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff}
.inst-dd-row .n{font-weight:600;font-size:.875rem}
.inst-dd-row .s{font-size:.7rem;color:var(--text-3)}

/* instrument facts — 2x2 */
.facts{margin-top:.85rem;display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.fact{display:flex;align-items:center;gap:.6rem;padding:.6rem .7rem;background:var(--g50);border:1px solid var(--g200);border-radius:10px}
.fact .fi{width:30px;height:30px;border-radius:8px;background:var(--white);border:1px solid var(--g200);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0}
.fact .fk{font-size:.6rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.fact .fv{font-weight:700;font-size:.85rem;margin-top:.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fact.bring-yes{background:rgba(245,158,11,.1)}
.fact.bring-yes .fi{color:#92400E;border-color:rgba(245,158,11,.4)} .fact.bring-yes .fv{color:#92400E}
.fact.bring-no{background:rgba(16,185,129,.08)}
.fact.bring-no .fi{color:var(--success-dark);border-color:rgba(16,185,129,.35)} .fact.bring-no .fv{color:var(--success-dark)}
.inst-empty{margin-top:.85rem;padding:.75rem .9rem;border:1.5px dashed var(--primary-light);border-radius:10px;
  background:linear-gradient(135deg,rgba(250,128,114,.04),rgba(255,160,122,.04));color:var(--text-2);font-size:.85rem;
  display:flex;align-items:center;gap:.5rem}
.inst-empty i{color:var(--primary)}

/* policies — scrolls internally */
.pol-zone{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin-top:1.25rem}
.pol-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:.5rem;padding-right:.25rem}
.pol-scroll::-webkit-scrollbar{width:6px}.pol-scroll::-webkit-scrollbar-thumb{background:var(--g300);border-radius:3px}
.policy{display:flex;gap:.7rem;align-items:flex-start;padding:.7rem .8rem;background:var(--g50);border:1px solid var(--g100);border-radius:11px}
.policy .pi{width:30px;height:30px;border-radius:8px;background:var(--white);border:1px solid var(--g200);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0;margin-top:.05rem}
.policy .pt{font-weight:700;font-size:.82rem}
.policy .pb{color:var(--text-2);font-size:.82rem;margin-top:.1rem;line-height:1.45}
.pol-none{color:var(--text-3);font-style:italic;font-size:.85rem}

/* notes strip */
.notes-strip{flex:0 0 auto;border-top:1px solid var(--g200);background:var(--g50);padding:.7rem 1.4rem;
  display:flex;align-items:center;gap:.7rem;overflow-x:auto}
.notes-strip::-webkit-scrollbar{height:6px}.notes-strip::-webkit-scrollbar-thumb{background:var(--g300);border-radius:3px}
.notes-label{font-size:.625rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;flex-shrink:0;
  display:flex;align-items:center;gap:.35rem}
.notes-label i{color:var(--primary)}
.note{flex-shrink:0;display:flex;align-items:center;gap:.55rem;background:var(--white);border:1px solid var(--g200);
  border-left:3px solid var(--g300);border-radius:10px;padding:.5rem .75rem;max-width:420px}
.note.important{border-left-color:var(--warning)}
.note.tip{border-left-color:var(--success)}
.note .ntag{font-size:.56rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:.15rem .4rem;border-radius:5px;flex-shrink:0}
.note.info .ntag{background:var(--g100);color:var(--text-2)}
.note.important .ntag{background:rgba(245,158,11,.15);color:#92400E}
.note.tip .ntag{background:rgba(16,185,129,.15);color:var(--success-dark)}
.note .nt{font-size:.8rem;color:var(--text);white-space:nowrap}
.notes-none{font-size:.8rem;color:var(--text-3);font-style:italic}

/* loading + error overlay */
.loading-overlay{position:fixed;inset:0;background:rgba(241,243,245,.92);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;z-index:999}
.loading-overlay.visible{display:flex}
.loading-card{background:var(--white);border-radius:16px;padding:32px 48px;box-shadow:var(--sh-lg);text-align:center}
.loading-spinner{width:36px;height:36px;border:3px solid var(--g200);border-top-color:var(--primary);
  border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;font-weight:500;color:var(--text-2)}

/* responsive: below 1000px stack + allow scroll (no-scroll cockpit is a desktop feature) */
@media(max-width:1000px){
  body{overflow:auto}
  .wrap{height:auto;min-height:100vh}
  .card{flex:none}
  .card-body{grid-template-columns:1fr}
  .col-money{border-right:none;border-bottom:1px solid var(--g200)}
  .col,.col-lesson{overflow:visible}
  .pol-zone{min-height:auto}.pol-scroll{overflow:visible}
}
@media(max-width:900px){.sidebar{display:none}.wrap{margin-left:0}}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-head"><div class="logo">EH</div><div class="logo-text">Enrollment Hub</div></div>
  <nav class="sidebar-nav">
    <a class="nav" href="#"><i class="fas fa-link"></i> Quick Links</a>
    <a class="nav" href="#"><i class="fas fa-building"></i> Studio Directory</a>
    <a class="nav" href="#"><i class="fas fa-star"></i> Teacher Directory</a>
    <a class="nav" href="#"><i class="fas fa-map-marked-alt"></i> Map</a>
    <a class="nav" href="#"><i class="fas fa-graduation-cap"></i> Programs</a>
    <a class="nav active" href="#"><i class="fas fa-scroll"></i> Call Script</a>
    <a class="nav" href="#"><i class="fas fa-file-alt"></i> Snippets</a>
    <a class="nav" href="#"><i class="fas fa-book-open"></i> Training</a>
  </nav>
</aside>

<div class="wrap">
  <div class="searchbar">
    <i class="fas fa-magnifying-glass lead"></i>
    <input id="studioSearch" type="text" placeholder="Search studio by brand, city, or state…" autocomplete="off">
    <div class="dd" id="studioDd"></div>
  </div>
  <div class="card" id="card"></div>
</div>

<script>
/* ── SUPABASE CONNECTION ── */
const SUPABASE_URL='https://kvyvjwepfrqqkvyyutdw.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2eXZqd2VwZnJxcWt2eXl1dGR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyMjgyOTgsImV4cCI6MjA4MjgwNDI5OH0.ZayLxzQCEFENvQ9FwpLm4x2le2Y9kJvSslX8DVRzAh8';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let STUDIOS=[];

/* ── HELPERS for the studio CMS rich-text fields ── */
function stripHtml(html){if(!html)return'';const t=document.createElement('div');t.innerHTML=html;return(t.textContent||t.innerText||'').trim()}
function hasContent(html){return stripHtml(html).length>0}
function scriptOf(full,script){if(hasContent(script))return script;if(hasContent(full))return full;return''}
function scriptOfText(full,script){return stripHtml(scriptOf(full,script))}

/* ── TRANSFORM one Supabase studio row into the call-script shape ── */
function transformStudio(s,brandsById,countTeachers){
  const brand=brandsById[s.brand_id]||{name:'Unknown brand'};

  const notes=(s.studio_notes||[]).map(n=>({
    type:n.note_type||'info',
    text:scriptOf(n.notes,n.notes_script)||stripHtml(n.title||''),
  })).filter(n=>n.text);

  const POLICY_ICON_MAP=[
    {match:['makeup','cancellation'],icon:'fa-calendar-plus'},
    {match:['withdraw'],icon:'fa-door-open'},
    {match:['holiday','closure','closed'],icon:'fa-snowflake'},
    {match:['teacher change','teacher swap','switch teacher'],icon:'fa-user-pen'},
    {match:['payment','billing','card'],icon:'fa-credit-card'},
    {match:['refund'],icon:'fa-rotate-left'},
    {match:['attendance','absence'],icon:'fa-user-check'},
    {match:['recital','performance'],icon:'fa-music'},
    {match:['photo','media'],icon:'fa-camera'},
    {match:['weather'],icon:'fa-cloud-bolt'},
    {match:['lateness','late','tardy'],icon:'fa-clock'},
  ];
  function iconForPolicy(title){const t=(title||'').toLowerCase();for(const{match,icon}of POLICY_ICON_MAP){if(match.some(m=>t.includes(m)))return icon}return'fa-file-shield'}

  const policies=(s.policies||[])
    .filter(p=>p.show_on_script!==false)
    .filter(p=>hasContent(p.notes_script))
    .map(p=>({title:p.title||'Policy',body:p.notes_script,icon:iconForPolicy(p.title)}));

  const studioDiscounts=(s.discounts||[])
    .filter(d=>d.show_on_script!==false)
    .map(d=>({percent:d.display_label||d.title||'',name:d.title||'',desc:scriptOfText(d.description,d.description_script)}));

  const instruments=(s.instruments||[]).map(i=>{
    const instName=i.name||i.instrument||'Instrument';
    return{
      name:instName,icon:i.icon||'fa-music',
      startAge:i.start_age!=null?i.start_age:5,
      method:i.method||'—',
      teacherCount:countTeachers?countTeachers(brand.name,s.city,instName):0,
      bringInstrument:!!i.bring_instrument,
    };
  });

  return{
    id:s.id,brand:brand.name,city:s.city||'',state:s.state||'',address:s.address||'',
    infoUrl:'#studio-info/'+s.id,
    defaultLength:s.default_length||45,cadence:s.cadence||'Once per week',
    prices:{30:s.monthly_rate||'—',45:s.price_45||'—',60:s.price_60||'—'},
    firstCharge:s.first_charge||'—',firstChargeProrated:!!s.first_charge_prorated,billingDay:s.billing_day||'—',
    annualFee:s.display_annual_fee||s.annual_fee||'—',
    annualFeeCovers:Array.isArray(s.annual_fee_covers)?s.annual_fee_covers:[],
    programsEnabled:!!s.programs_enabled,programsUrl:s.programs_url||'#',
    scheduling:s.scheduling_platform||'',schedulingUrl:s.scheduling_url||'#',
    studioDiscounts,policies,instruments,notes,
  };
}

/* ── LOAD everything from Supabase ── */
async function loadStudios(){
  try{
    const[brandsRes,studiosRes,instrumentsRes,notesRes,policiesRes,discountsRes,teachersRes,teacherCitiesRes,teacherInstrumentsRes]=await Promise.all([
      supabaseClient.from('brands').select('*'),
      supabaseClient.from('studios').select('*').order('city'),
      supabaseClient.from('studio_instruments').select('*').order('order_index'),
      supabaseClient.from('studio_notes').select('*').order('order_index'),
      supabaseClient.from('studio_policies').select('*').order('order_index'),
      supabaseClient.from('studio_discounts').select('*').order('order_index'),
      supabaseClient.from('teachers').select('*'),
      supabaseClient.from('teacher_cities').select('*'),
      supabaseClient.from('teacher_instruments').select('*'),
    ]);
    if(brandsRes.error)throw brandsRes.error;
    if(studiosRes.error)throw studiosRes.error;

    const brandsById={};
    (brandsRes.data||[]).forEach(b=>{brandsById[b.id]=b});

    const activeTeachers=(teachersRes.data||[]).filter(t=>t.status==='active');
    const citiesByTeacher={};
    (teacherCitiesRes.data||[]).forEach(tc=>{(citiesByTeacher[tc.teacher_id]=citiesByTeacher[tc.teacher_id]||[]).push((tc.city||'').toLowerCase().trim())});
    const instrumentsByTeacher={};
    (teacherInstrumentsRes.data||[]).forEach(ti=>{(instrumentsByTeacher[ti.teacher_id]=instrumentsByTeacher[ti.teacher_id]||[]).push((ti.instrument||'').toLowerCase().trim())});
    function countTeachers(brandName,city,instrumentName){
      if(!brandName||!instrumentName)return 0;
      const bl=brandName.toLowerCase().trim(),cl=(city||'').toLowerCase().trim(),il=instrumentName.toLowerCase().trim();
      return activeTeachers.filter(t=>{
        if((t.brand||'').toLowerCase().trim()!==bl)return false;
        const tc=citiesByTeacher[t.id]||[];if(cl&&!tc.includes(cl))return false;
        return(instrumentsByTeacher[t.id]||[]).includes(il);
      }).length;
    }

    STUDIOS=(studiosRes.data||[]).map(s=>{
      s.instruments=(instrumentsRes.data||[]).filter(i=>i.studio_id===s.id);
      s.studio_notes=(notesRes.data||[]).filter(n=>n.studio_id===s.id);
      s.policies=(policiesRes.data||[]).filter(p=>p.studio_id===s.id);
      s.discounts=(discountsRes.data||[]).filter(d=>d.studio_id===s.id);
      return transformStudio(s,brandsById,countTeachers);
    });

    if($dd&&$dd.classList.contains('open'))renderDd($search.value);
    if(activeStudio){const r=STUDIOS.find(s=>s.id===activeStudio.id);if(r){activeStudio=r;render()}}
    const ov=document.getElementById('loadingOverlay');if(ov)ov.classList.remove('visible');
  }catch(err){
    console.error('Error loading studios from Supabase:',err);
    const ov=document.getElementById('loadingOverlay');
    if(ov){const msg=(err&&err.message)?err.message:String(err);
      ov.innerHTML=`<div class="loading-card" style="max-width:460px;text-align:left">
        <div style="text-align:center;color:#E96E5D;margin-bottom:14px"><i class="fas fa-triangle-exclamation" style="font-size:36px"></i></div>
        <div style="font-weight:700;font-size:16px;color:#2D3748;text-align:center;margin-bottom:8px">Couldn't load studios</div>
        <div style="font-size:13px;color:#718096;text-align:center;margin-bottom:14px">Supabase returned an error:</div>
        <div style="font-family:ui-monospace,monospace;font-size:12px;background:#F8F9FA;padding:10px 12px;border-radius:8px;color:#2D3748;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto">${esc(msg)}</div>
        <button onclick="location.reload()" style="margin-top:14px;width:100%;padding:10px;background:#FA8072;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer">Try again</button>
      </div>`;}
  }
}

function showLoadingOverlay(){
  if(document.getElementById('loadingOverlay'))return;
  const ov=document.createElement('div');
  ov.id='loadingOverlay';ov.className='loading-overlay visible';
  ov.innerHTML=`<div class="loading-card"><div class="loading-spinner"></div><div class="loading-text">Loading studios…</div></div>`;
  document.body.appendChild(ov);
}

let activeStudio=null,activeInstrument=null,instQuery='';
const $search=document.getElementById('studioSearch'),$dd=document.getElementById('studioDd'),$card=document.getElementById('card');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

$search.addEventListener('focus',()=>{renderDd($search.value);$dd.classList.add('open')});
$search.addEventListener('input',e=>{renderDd(e.target.value);$dd.classList.add('open')});
document.addEventListener('click',e=>{if(!e.target.closest('.searchbar'))$dd.classList.remove('open');if(!e.target.closest('.inst-pick'))closeInstDd()});
function renderDd(q){q=(q||'').toLowerCase().trim();
  const f=STUDIOS.filter(s=>!q||s.brand.toLowerCase().includes(q)||s.city.toLowerCase().includes(q)||s.state.toLowerCase().includes(q));
  $dd.innerHTML=f.length?f.map(s=>`<div class="dd-row" onclick="selectStudio('${s.id}')"><div class="pin"><i class="fas fa-location-dot"></i></div>
    <div><div class="city">${esc(s.city)}, ${esc(s.state)}</div><div class="meta">${esc(s.brand)} · ${esc(s.address)}</div></div></div>`).join('')
    :`<div class="dd-row" style="cursor:default;color:var(--text-3)">No studios match "${esc(q)}"</div>`}
function selectStudio(id){activeStudio=STUDIOS.find(s=>s.id===id);activeInstrument=null;instQuery='';$dd.classList.remove('open');$search.value='';render()}

function render(){
  if(!activeStudio){
    $card.innerHTML=`<div class="empty"><div class="ic"><i class="fas fa-headset"></i></div>
      <h2>Pick a studio to start</h2><p>Search by brand, city, or state above. Everything for the call lands here on one screen — no scrolling.</p></div>`;
    return;
  }
  const s=activeStudio;
  const prog=s.programsEnabled
    ? `<div class="prog-pill"><i class="fas fa-graduation-cap"></i> Programs <span class="pv">Yes</span><a href="${s.programsUrl||'#'}">View</a></div>`
    : `<div class="prog-pill"><i class="fas fa-graduation-cap"></i> Programs <span class="pv">No</span></div>`;
  const sched=s.scheduling
    ? `<div class="prog-pill"><i class="fas fa-calendar-check"></i> Scheduling <span class="pv">${esc(s.scheduling)}</span><a href="${s.schedulingUrl||'#'}">Open</a></div>`
    : '';
  $card.innerHTML=`
    <div class="card-head">
      <div class="ht">
        <div class="eyebrow"><i class="fas fa-scroll"></i> Call Script</div>
        <h1>${esc(s.brand)} — ${esc(s.city)}, ${esc(s.state)}</h1>
        <div class="addr"><i class="fas fa-map-marker-alt"></i> ${esc(s.address)}</div>
      </div>
      <div class="hc">
        ${sched}
        ${prog}
        <a class="head-btn" href="${s.infoUrl||'#'}"><i class="fas fa-circle-info"></i> Studio Info</a>
      </div>
    </div>
    <div class="legend">
      <span class="lg"><span class="dot good"></span> Included / we handle it</span>
      <span class="lg"><span class="dot flag"></span> Mention to the customer</span>
    </div>
    <div class="card-body">
      <div class="col col-money">${renderMoney(s)}</div>
      <div class="col col-lesson">${renderLesson(s)}</div>
    </div>
    ${renderNotes(s)}
  `;
  wireInst();
}

function renderMoney(s){
  const L=s.defaultLength,p=s.prices[L],others=[30,45,60].filter(x=>x!==L);
  const covers=s.annualFeeCovers||[],promos=s.studioDiscounts||[];
  return `
    <div class="block">
      <div class="block-label"><i class="fas fa-tag"></i> Standard pricing</div>
      <div class="price-row">
        <div class="price-amt">${esc(p.split('/')[0])}</div>
        <div class="price-unit">/${esc(p.split('/')[1]||'mo')} · ${L} min</div>
        <div class="price-badge">Standard</div>
      </div>
      <div class="cadence"><strong>${esc(s.cadence)}</strong></div>
      <div class="other">${others.map(x=>`<span class="ol"><span class="l">${x} min</span><span class="p">${esc(s.prices[x])}</span></span>`).join('')}</div>
    </div>

    <div class="block">
      <div class="block-label"><i class="fas fa-calendar-day"></i> Billing</div>
      <div class="annual">
        <div class="annual-top"><div class="annual-ic"><i class="fas fa-receipt"></i></div>
          <div><div class="annual-lbl">Registration fee</div><div class="annual-amt">${esc(s.annualFee)}<span class="per">/yr</span></div></div></div>
        ${covers.length?`<div class="covers">${covers.map(c=>`<span class="cchip"><i class="fas fa-check"></i>${esc(c)}</span>`).join('')}</div>`:''}
      </div>
      <div class="steps">
        <div class="step"><span class="num">1</span><div><div class="sl">First charge</div><div class="sv">${esc(s.firstCharge)}</div></div></div>
        <div class="step"><span class="num">2</span><div><div class="sl">First month</div><div class="sv ${s.firstChargeProrated?'warn':''}">${s.firstChargeProrated?'Prorated':'Full price'}</div></div></div>
        <div class="step"><span class="num">3</span><div><div class="sl">Recurring</div><div class="sv">${esc(s.billingDay)}</div></div></div>
      </div>
    </div>

    <div class="block">
      <div class="block-label"><i class="fas fa-tags"></i> Promos · if needed to close</div>
      ${promos.length?promos.map(d=>`<div class="promo"><span class="pct">${esc(d.percent)}</span>
        <div><div class="pn">${esc(d.name)}</div><div class="pd">${esc(d.desc)}</div></div></div>`).join('')
        :`<div class="promo-none">No promos at this studio.</div>`}
    </div>
  `;
}

function renderLesson(s){
  const i=activeInstrument;
  let facts;
  if(i){
    facts=`<div class="facts">
      <div class="fact"><div class="fi"><i class="fas fa-baby"></i></div><div><div class="fk">Start age</div><div class="fv">${i.startAge}+ yrs</div></div></div>
      <div class="fact"><div class="fi"><i class="fas fa-chalkboard-teacher"></i></div><div><div class="fk">Teachers</div><div class="fv">${i.teacherCount} on staff</div></div></div>
      <div class="fact"><div class="fi"><i class="fas fa-book"></i></div><div><div class="fk">Method</div><div class="fv" title="${esc(i.method)}">${esc(i.method)}</div></div></div>
      <div class="fact ${i.bringInstrument?'bring-yes':'bring-no'}"><div class="fi"><i class="fas ${i.bringInstrument?'fa-exclamation-circle':'fa-check-circle'}"></i></div>
        <div><div class="fk">Bring day 1?</div><div class="fv">${i.bringInstrument?'Yes':'We provide'}</div></div></div>
    </div>`;
  }else{
    facts=`<div class="inst-empty"><i class="fas fa-arrow-up"></i> Search an instrument to see age, teachers, method & bring-info</div>`;
  }
  const pols=s.policies||[];
  return `
    <div class="inst-zone">
      <div class="block-label"><i class="fas fa-music"></i> Instrument</div>
      <div class="inst-pick">
        <div class="inst-field">
          <i class="fas fa-magnifying-glass lead"></i>
          <input id="instInput" class="inst-input ${i?'chosen':''}" placeholder="Search instruments…" value="${i?esc(i.name):''}" autocomplete="off">
          ${i?`<button class="inst-clear" onclick="clearInst()"><i class="fas fa-times"></i></button>`:`<i class="fas fa-chevron-down inst-caret"></i>`}
          <div class="inst-dd" id="instDd"></div>
        </div>
        ${facts}
      </div>
    </div>
    <div class="pol-zone">
      <div class="block-label"><i class="fas fa-file-shield"></i> Policies · what to cover</div>
      <div class="pol-scroll">
        ${pols.length?pols.map(p=>`<div class="policy"><div class="pi"><i class="fas ${p.icon}"></i></div>
          <div><div class="pt">${esc(p.title)}</div><div class="pb">${p.body}</div></div></div>`).join('')
          :`<div class="pol-none">No policies listed for this studio.</div>`}
      </div>
    </div>
  `;
}

function renderNotes(s){
  const n=s.notes||[];
  const items=n.length?n.map(x=>{const lbl=x.type==='important'?'Heads up':x.type==='tip'?'Tip':'Note';
    return `<div class="note ${x.type}"><span class="ntag">${lbl}</span><span class="nt">${x.text}</span></div>`}).join('')
    :`<span class="notes-none">No additional notes for this studio.</span>`;
  return `<div class="notes-strip"><span class="notes-label"><i class="fas fa-sticky-note"></i> Notes</span>${items}</div>`;
}

/* instrument picker wiring */
function wireInst(){const inp=document.getElementById('instInput');if(!inp)return;
  inp.addEventListener('focus',()=>{if(activeInstrument)inp.value='';instQuery=inp.value;renderInstDd();document.getElementById('instDd').classList.add('open')});
  inp.addEventListener('input',e=>{instQuery=e.target.value;renderInstDd();document.getElementById('instDd').classList.add('open')});
  inp.addEventListener('blur',()=>setTimeout(()=>{if(activeInstrument&&!document.getElementById('instDd').classList.contains('open'))inp.value=activeInstrument.name},200))}
function renderInstDd(){const q=(instQuery||'').toLowerCase().trim();
  const f=activeStudio.instruments.filter(i=>!q||i.name.toLowerCase().includes(q)||i.method.toLowerCase().includes(q));
  const dd=document.getElementById('instDd');
  dd.innerHTML=f.length?f.map(i=>`<div class="inst-dd-row" onclick="pickInst('${i.name.replace(/'/g,"\\'")}')">
    <div class="di"><i class="fas ${i.icon}"></i></div><div><div class="n">${esc(i.name)}</div>
    <div class="s">${i.teacherCount} ${i.teacherCount===1?'teacher':'teachers'} · Ages ${i.startAge}+ · ${esc(i.method)}</div></div></div>`).join('')
    :`<div class="inst-dd-row" style="cursor:default;color:var(--text-3)">No instruments match "${esc(instQuery)}"</div>`}
function pickInst(n){activeInstrument=activeStudio.instruments.find(x=>x.name===n);instQuery='';closeInstDd();render()}
function clearInst(){activeInstrument=null;instQuery='';closeInstDd();render()}
function closeInstDd(){const d=document.getElementById('instDd');if(d)d.classList.remove('open')}

/* boot: show empty state, then pull everything from Supabase */
render();
showLoadingOverlay();
loadStudios();
</script>
</body>
</html>
